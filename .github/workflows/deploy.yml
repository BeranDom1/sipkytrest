name: Deploy to Wedos via FTP

on:
  push:
    branches: [ main ]

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.2.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          state-name: .ftp-deploy-sync-state-v2.json
          exclude: |
            .git/**
            .github/**
            .gitignore
            .dockerignore
            Dockerfile
            compose.yaml
            ops/**
            .vm/**
            **/*.sql
            **/*.md
            database/**
            discourse-category-auto-tags/**
            node_modules/**
            .env
            config/**
            liga-app-clean/**
            img/valentyn.png
            img/event-poster.jpg
            img/514314068_1768049717116029_1756491033477084035_n.jpg
            img/uvodni_fotka.jpg
            img/open.jpg
            **/*.log
